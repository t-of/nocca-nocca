<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2b2e33"/>
      <stop offset="1" stop-color="#1e2023"/>
    </radialGradient>
    <filter id="whiteVein" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.18" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.61  0 0 0 0 0.62  0 0 0 0 0.65  0 0 0 0.8 0" result="c"/>
      <feComposite in="c" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="blackVein" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.18" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.56  0 0 0 0 0.57  0 0 0 0 0.6  0 0 0 0.55 0" result="c"/>
      <feComposite in="c" in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="topW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf9f6"/>
      <stop offset="1" stop-color="#e3e0da"/>
    </linearGradient>
    <linearGradient id="leftW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e6e0"/>
      <stop offset="1" stop-color="#cfcbc2"/>
    </linearGradient>
    <linearGradient id="rightW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4d0c8"/>
      <stop offset="1" stop-color="#b6b1a8"/>
    </linearGradient>
    <linearGradient id="topB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e3034"/>
      <stop offset="1" stop-color="#17181b"/>
    </linearGradient>
    <linearGradient id="leftB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1d20"/>
      <stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="rightB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121214"/>
      <stop offset="1" stop-color="#030304"/>
    </linearGradient>
  </defs>

  <!-- 背景: 暗い大理石の広間 -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- 黒い大理石の立方体（奥） -->
  <g>
    <polygon points="60,220 200,290 200,400 60,330" fill="url(#leftB)"/>
    <polygon points="200,290 340,220 340,330 200,400" fill="url(#rightB)"/>
    <polygon points="200,150 340,220 200,290 60,220" fill="url(#topB)"/>
    <polygon points="200,150 340,220 200,290 60,220" filter="url(#blackVein)"/>
  </g>

  <!-- 白い大理石の立方体（手前） -->
  <g>
    <polygon points="172,310 312,380 312,490 172,420" fill="url(#leftW)"/>
    <polygon points="312,380 452,310 452,420 312,490" fill="url(#rightW)"/>
    <polygon points="312,240 452,310 312,380 172,310" fill="url(#topW)"/>
    <polygon points="312,240 452,310 312,380 172,310" filter="url(#whiteVein)"/>
  </g>
</svg>
